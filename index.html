<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1D22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Vokabelkasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&family=Noto+Sans:wght@400&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
  /* Layout: eine schmale Spalte wie eine Buchseite. Fortschritt oben, grosse Tippflaechen, Aktionen unten. */
  :root {
    --bg: #EDF3F4;
    --surface: #FFFFFF;
    --ink: #14313A;
    --muted: #566F76;
    --line: #CFDDE0;
    --accent: #2D7C92;
    --on-accent: #FFFFFF;
    --accent-soft: #D6EAF0;
    --tip: #F3DDAE;
    --on-tip: #4A3410;
    --good: #1F7A4D;
    --on-good: #FFFFFF;
    --good-bg: #DDF1E5;
    --bad: #B4412F;
    --bad-bg: #F8E0DB;
    --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ipa: 'Noto Sans', 'Lucida Sans Unicode', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1D22; --surface: #16292F; --ink: #E4EFF1; --muted: #9BB4BA; --line: #2A444B;
      --accent: #5DB8CF; --on-accent: #08222A; --accent-soft: #1D3D47;
      --tip: #4B3C1C; --on-tip: #F2DFB4;
      --good: #6BCB93; --on-good: #08241A; --good-bg: #1A3A2A;
      --bad: #F0907F; --bad-bg: #432622;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1D22; --surface: #16292F; --ink: #E4EFF1; --muted: #9BB4BA; --line: #2A444B;
    --accent: #5DB8CF; --on-accent: #08222A; --accent-soft: #1D3D47;
    --tip: #4B3C1C; --on-tip: #F2DFB4;
    --good: #6BCB93; --on-good: #08241A; --good-bg: #1A3A2A;
    --bad: #F0907F; --bad-bg: #432622;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-inline: 16px; padding-block: 14px;
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 560px; margin-inline: auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }

  /* Buttons */
  .btn {
    min-height: 56px; border-radius: 16px; border: 2px solid transparent;
    font-weight: 600; font-size: 1.05rem; padding: 0 20px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.warm { background: var(--tip); color: var(--on-tip); }
  .btn.good { background: var(--good); color: var(--on-good); }
  .btn.link { background: none; min-height: 44px; width: auto; color: var(--muted); font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; }
  .btn.sm { min-height: 44px; font-size: .95rem; width: auto; padding: 0 16px; }
  .actions { display: grid; gap: 12px; margin-top: auto; padding-top: 8px; }
  .actions.two { grid-template-columns: 1fr 1fr; }
  .icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }

  /* Karten */
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .tag { align-self: flex-start; background: var(--tip); color: var(--on-tip); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .label { color: var(--muted); font-size: .9rem; }
  .big { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 10vw, 3rem); line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
  .big.long { font-size: clamp(1.5rem, 7vw, 2rem); }
  .ipa { font-family: var(--ipa); color: var(--muted); font-size: 1.05rem; }
  .ex { background: var(--tip); color: var(--on-tip); border-radius: 14px; padding: 12px 14px; }
  .ex b { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
  .speak { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 500; }
  .stage { flex: 1; display: flex; flex-direction: column; gap: 14px; }

  /* Kopf */
  .topbtns { display: flex; align-items: center; gap: 8px; }
  .topbtns .icon-btn { position: relative; width: 44px; height: 44px; color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .shead { display: flex; align-items: center; gap: 12px; }
  .bar, .meter { flex: 1; height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar span, .meter span { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .25s ease; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; min-width: 3ch; text-align: right; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: .875rem; }

  /* Start */
  .brand h1 { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .brand p { color: var(--muted); margin-top: 4px; }
  .pick { display: grid; gap: 12px; }
  .who { display: flex; align-items: center; gap: 16px; text-align: left; min-height: 84px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); width: 100%; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.6rem; flex: none; }
  .avatar.a { background: var(--accent); color: var(--on-accent); }
  .avatar.b { background: var(--tip); color: var(--on-tip); }
  .who strong { font-family: var(--display); font-size: 1.35rem; display: block; line-height: 1.15; }

  .stats { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .streak { display: flex; align-items: center; gap: 8px; color: var(--accent); }
  .streak b { font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .streak span { font-size: .8rem; color: var(--muted); line-height: 1.15; }
  .hero { text-align: center; display: grid; justify-items: center; gap: 2px; padding: 20px 16px 16px; --fl: var(--muted); }
  .hero.t1 { --fl: #E8821E; }
  .hero.t2 { --fl: #F2A900; }
  .hero .flame { color: var(--fl); line-height: 0; }
  .hero.t0 .flame { opacity: .45; }
  .hero .num { font-family: var(--display); font-weight: 800; font-size: 4.6rem; line-height: .95; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hero .lbl { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
  .hero .rec { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .hero .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; max-width: 340px; margin: 4px 0 8px; }
  .wd { display: grid; justify-items: center; gap: 4px; }
  .wd i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: var(--muted); }
  .wd i svg { width: 18px; height: 18px; }
  .wd span { font-size: .75rem; color: var(--muted); }
  .wd.ok i { background: #E8821E; border-color: #E8821E; color: #3A2000; }
  .hero.t2 .wd.ok i { background: #F2A900; border-color: #F2A900; }
  .wd.frei i { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wd.now i { border: 2px dashed #E8821E; }
  .wd.miss i { opacity: .5; }
  .wd.future i { border-style: dotted; opacity: .6; }
  .wd.today span { color: var(--ink); font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) { .hero.t1 .flame svg, .hero.t2 .flame svg { animation: flick 2.4s ease-in-out infinite; transform-origin: 50% 90%; } }
  @keyframes flick { 0%, 100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.06) rotate(-2deg); } 70% { transform: scale(.98) rotate(1.5deg); } }
  .pet { display: grid; justify-items: center; }
  .hero .lbl { display: flex; align-items: center; gap: 6px; }
  .lbl svg { color: var(--fl); }
  .grow { display: grid; gap: 8px; }
  .grow .bar { height: 12px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .grow .bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .petrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .petcard { display: grid; justify-items: center; gap: 2px; padding: 12px 8px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); font-family: var(--display); font-size: 1.2rem; font-weight: 700; }
  .petcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .ladder figure { margin: 0; display: grid; justify-items: center; }
  .ladder figcaption { font-size: .72rem; color: var(--muted); }
  .ladder .locked svg { filter: brightness(0) opacity(.28); }
  .lvl { text-align: center; display: grid; justify-items: center; gap: 6px; border-color: #F2B01E; }
  .chapdet { border: 2px solid var(--line); border-radius: 16px; background: var(--surface); margin: 8px 0; }
  .chapdet summary { min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-weight: 700; cursor: pointer; }
  .chapdet .list { padding: 0 8px 8px; }
  .goal { display: grid; gap: 6px; min-width: 0; }
  .goal p { font-size: .9rem; }

  .modes { display: grid; gap: 12px; }
  .mode { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; min-height: 76px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; width: 100%; }
  .mode:active { transform: scale(.98); }
  .mode .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .mode strong { font-family: var(--display); font-size: 1.25rem; display: block; line-height: 1.15; }
  .mode span.d { color: var(--muted); font-size: .875rem; }

  .trays { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .tray { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .well { width: 100%; border: 2px solid var(--line); border-top: none; border-radius: 0 0 12px 12px; background: var(--accent-soft); display: flex; justify-content: center; padding-top: 6px; font-family: var(--display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .tray.new .well { background: var(--tip); color: var(--on-tip); border-style: dashed; border-top: none; }
  .tl { font-size: .75rem; font-weight: 600; }
  .ti { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.15; }

  /* Tippen und Hoeren */
  .input { width: 100%; min-height: 58px; border: 2px solid var(--line); border-radius: 16px; padding: 0 16px; font: 500 1.25rem var(--body); background: var(--surface); color: var(--ink); }
  .input:focus { border-color: var(--accent); }
  .fb { border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
  .fb.good { background: var(--good-bg); color: var(--good); }
  .fb.bad { background: var(--bad-bg); color: var(--bad); }
  .fb strong { font-family: var(--display); font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
  .fb .ans { color: var(--ink); font-weight: 500; font-size: 1.1rem; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; min-height: 58px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 1.05rem; font-weight: 500; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .opt:active { transform: scale(.98); }
  .opt.ok { border-color: var(--good); background: var(--good-bg); }
  .opt.no { border-color: var(--bad); background: var(--bad-bg); }
  .opt:disabled { cursor: default; transform: none; }
  .bigspeak { width: 112px; height: 112px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin: 4px auto; }
  .bigspeak:active { transform: scale(.96); }
  .center { text-align: center; }

  /* Ergebnis */
  .result { align-items: center; text-align: center; padding-block: 28px; }
  .stars { display: flex; gap: 8px; color: var(--tip); }
  .stars svg { width: 56px; height: 56px; }
  .stars .on { color: #E0A82E; animation: pop .4s ease backwards; }
  .stars .on:nth-child(2) { animation-delay: .12s; }
  .stars .on:nth-child(3) { animation-delay: .24s; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Eltern */
  .sec { display: grid; gap: 12px; }
  .sec h2 { font-size: 1.35rem; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: .875rem; font-weight: 500; }
  .field .input { font-size: 1rem; min-height: 50px; }
  .list { display: grid; gap: 0; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
  .li:first-child { border-top: none; }
  .li div { min-width: 0; overflow-wrap: anywhere; }
  .li b { font-weight: 600; }
  .li .de { color: var(--muted); font-size: .9rem; }
  .li .tag { font-size: .65rem; }
  .li .del { min-width: 44px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .switch { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .switch input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  .chaps { display: grid; gap: 2px; margin: 6px 0 4px; }
  .chap { min-height: 52px; font-weight: 600; }
  .mode[disabled] { opacity: .45; }
  .ok-msg { color: var(--good); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .btn:active, .mode:active, .opt:active, .bigspeak:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
/* Eigene Maskottchen: Fuchs, Eule, Drache, Katze. Stufen 0-2, Stimmungen 'ruhig' | 'jubel' | 'trost'. */
var TIERE = (function () {
  var INK = '#1E2B30';
  function eye(x, y, mood, r) {
    r = r || 3.6;
    if (mood === 'jubel') return '<path d="M' + (x - 4.2) + ' ' + (y + 1.5) + ' Q' + x + ' ' + (y - 5.5) + ' ' + (x + 4.2) + ' ' + (y + 1.5) + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-linecap="round"/>';
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + INK + '"/><circle cx="' + (x + 1.2) + '" cy="' + (y - 1.3) + '" r="1.2" fill="#fff"/>';
  }
  function brow(x, y, side, mood) { // side: -1 links, 1 rechts
    if (mood !== 'trost') return '';
    var inner = x - side * 5, outer = x + side * 5; // innen = zur Mitte
    return '<path d="M' + (x + side * 5) + ' ' + (y - 6) + ' L' + (x - side * 5) + ' ' + (y - 10) + '" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linecap="round" transform="translate(0 0)"/>';
  }
  function eyes(lx, rx, y, mood) { return eye(lx, y, mood) + eye(rx, y, mood) + brow(lx, y, -1, mood) + brow(rx, y, 1, mood); }
  function mouth(x, y, mood, w) {
    w = w || 6;
    if (mood === 'jubel') return '<path d="M' + (x - w - 1) + ' ' + (y - 1) + ' Q' + x + ' ' + (y + 12) + ' ' + (x + w + 1) + ' ' + (y - 1) + ' Z" fill="' + INK + '"/><path d="M' + (x - 3) + ' ' + (y + 5) + ' Q' + x + ' ' + (y + 8) + ' ' + (x + 3) + ' ' + (y + 5) + ' Q' + x + ' ' + (y + 3) + ' ' + (x - 3) + ' ' + (y + 5) + '" fill="#F08A8A"/>';
    if (mood === 'trost') return '<path d="M' + (x - w + 1) + ' ' + (y + 3) + ' Q' + x + ' ' + (y - 2) + ' ' + (x + w - 1) + ' ' + (y + 3) + '" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linecap="round"/>';
    return '<path d="M' + (x - w) + ' ' + y + ' Q' + x + ' ' + (y + 6) + ' ' + (x + w) + ' ' + y + '" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linecap="round"/>';
  }
  function cheeks(lx, rx, y) { return '<ellipse cx="' + lx + '" cy="' + y + '" rx="4.5" ry="3" fill="#F08A8A" opacity=".45"/><ellipse cx="' + rx + '" cy="' + y + '" rx="4.5" ry="3" fill="#F08A8A" opacity=".45"/>'; }
  function spark(x, y, s) { return '<path d="M' + x + ' ' + (y - s) + ' L' + (x + s * .3) + ' ' + (y - s * .3) + ' L' + (x + s) + ' ' + y + ' L' + (x + s * .3) + ' ' + (y + s * .3) + ' L' + x + ' ' + (y + s) + ' L' + (x - s * .3) + ' ' + (y + s * .3) + ' L' + (x - s) + ' ' + y + ' L' + (x - s * .3) + ' ' + (y - s * .3) + ' Z" fill="#F2B01E"/>'; }
  function sparks(mood) { return mood === 'jubel' ? spark(14, 26, 6) + spark(106, 20, 7) + spark(100, 56, 4) : ''; }

  var K = {
    fuchs: function (st, mood) {
      var O = '#E8821E', D = '#B85F0E', C = '#FFF1DC', bk = [.62, .85, 1][st], tail = [.7, .95, 1.2][st];
      var s = '';
      s += '<g transform="translate(60 96) scale(' + tail + ') translate(-60 -96)"><path d="M84 96 Q116 94 112 62 Q106 76 92 80 Q98 66 90 56 Q80 70 76 88 Z" fill="' + O + '"/><path d="M112 62 Q106 76 100 82 Q112 82 114 70 Z" fill="' + C + '"/></g>';
      s += '<g transform="translate(60 108) scale(' + (.85 + bk * .15) + ' ' + bk + ') translate(-60 -108)"><ellipse cx="60" cy="88" rx="26" ry="22" fill="' + O + '"/><ellipse cx="60" cy="93" rx="15" ry="15" fill="' + C + '"/></g>';
      s += '<ellipse cx="46" cy="108" rx="9" ry="5" fill="' + D + '"/><ellipse cx="74" cy="108" rx="9" ry="5" fill="' + D + '"/>';
      s += '<path d="M33 42 L36 10 L57 30 Z" fill="' + O + '"/><path d="M87 42 L84 10 L63 30 Z" fill="' + O + '"/><path d="M38 33 L39 19 L49 29 Z" fill="' + D + '"/><path d="M82 33 L81 19 L71 29 Z" fill="' + D + '"/>';
      s += '<ellipse cx="60" cy="54" rx="29" ry="25" fill="' + O + '"/>';
      s += '<path d="M31 58 Q45 52 60 66 Q75 52 89 58 Q80 80 60 80 Q40 80 31 58 Z" fill="' + C + '"/>';
      s += '<ellipse cx="60" cy="61" rx="4.2" ry="3.2" fill="' + INK + '"/>' + eyes(46, 74, 50, mood) + mouth(60, 67, mood, 5) + cheeks(40, 80, 61);
      if (st >= 2) s += '<path d="M38 76 Q60 90 82 76 L80 86 Q60 98 40 86 Z" fill="#2D7C92"/><path d="M72 88 L78 104 L68 100 Z" fill="#2D7C92"/>';
      return s;

    var chapSec = '<section class="card"><h3 style="font-size:1.15rem">Was üben?</h3><div class="chaps">' + chapHtml + '</div>' +
      '<button class="btn link" data-a="chap-all">' + (allOn ? 'Alle abwählen' : 'Alle auswählen') + '</button></section>';
    var counts = [0, 0, 0, 0, 0, 0];
    allWords().forEach(function (w) { var c = P.cards[w.id]; counts[c ? c.box : 0]++; });  /* Kasten zählt über alle Kapitel */
    var trays = counts.map(function (c, i) {
      var h = 36 + Math.min(c, 14) * 7;
      return '<div class="tray' + (i === 0 ? ' new' : '') + '"><div class="well" style="height:' + h + 'px">' + c + '</div>' +

    }).join('');

      : '<p class="note">Für heute ist alles geschafft. Du kannst trotzdem üben, das zählt dann aber nicht für die Serie.</p>';
    var pct = Math.min(100, Math.round(today / GOAL * 100));
    return '<div class="top"><h1 style="font-size:1.9rem">Hallo, ' + esc(p.name) + '!</h1>' +
      '<div class="topbtns"><button class="icon-btn" data-a="snd" aria-pressed="' + soundOn() + '" aria-label="' + (soundOn() ? 'Ton ausschalten' : 'Ton einschalten') + '">' + ICON.speaker(22) + (soundOn() ? '' : '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="position:absolute"><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>') + '</button>' +
      '</div></div>' +
      (levelUpPending() ? levelUpHtml() : '') + heroHtml(si) + (prog().pet ? growHtml() : '') +
      '<div class="card stats"><div class="goal"><p>Heute: <b>' + Math.min(today, GOAL) + ' von ' + GOAL + '</b> Wörtern</p><div class="meter"><span style="width:' + pct + '%"></span></div></div></div>' +
      chapSec + todo +
      '<div class="modes">' +
      '<button class="mode" data-a="start" data-m="cards"' + (nSel ? '' : ' disabled') + '><span class="ic">' + ICON.cards + '</span><span><strong>Karteikarten</strong><span class="d">Umdrehen und selbst prüfen</span></span></button>' +
      '<button class="mode" data-a="start" data-m="type"' + (nSel ? '' : ' disabled') + '><span class="ic">' + ICON.keys + '</span><span><strong>Tippen</strong><span class="d">Deutsch lesen, Englisch schreiben</span></span></button>' +
      '<button class="mode" data-a="start" data-m="listen"' + (nSel ? '' : ' disabled') + '><span class="ic">' + ICON.speaker(26) + '</span><span><strong>Hören</strong><span class="d">Anhören und die Bedeutung wählen</span></span></button>' +
      '<button class="mode" data-a="start-test"' + (nSel ? '' : ' disabled') + '><span class="ic">' + ICON.check + '</span><span><strong>Mini-Test</strong><span class="d">' + Math.min(TEST_SIZE, nSel) + ' Fragen gemischt, ohne Hilfen</span></span></button>' +
      '</div>' +
      '<section class="card"><h3 style="font-size:1.15rem">Dein Kasten</h3><div class="trays">' + trays + '</div>' +
      '<p class="muted small">Ein richtiges Wort rutscht ein Fach weiter und kommt später wieder. Ein falsches fällt zurück in Fach 1.</p></section>' +
      '<div class="actions"><button class="btn link" data-a="parents">Für Eltern</button></div>';
  }

  function ipaHtml(w) { return (DB.settings.ipa && w.ipa && !(session && session.test)) ? '<div class="ipa">[' + esc(w.ipa) + ']</div>' : ''; }
  function curMode(s) { return s.test ? s.q[s.i].sub : s.mode; }
  function speakBtn(label) { return '<button class="speak" data-a="speak">' + ICON.speaker(22) + '<span>' + label + '</span></button>'; }

  function vSession() {
    var s = session, it = s.q[s.i], w = it.w, pct = Math.round(s.i / s.q.length * 100);
    var head = '<div class="shead"><button class="icon-btn" data-a="quit" aria-label="Beenden">' + ICON.back + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>' +
      '<span class="count">' + (s.i + 1) + '/' + s.q.length + '</span></div>' +
      (s.test ? '<p class="note">Mini-Test · ohne Hilfen, zählt nicht für den Fortschritt</p>' : s.practice ? '<p class="note">Übungsrunde · zählt nicht für die Serie</p>' : '');
    var body = '', mode = curMode(s);

    if (mode === 'cards') {
      if (s.phase === 'front') {
        body = '<div class="stage"><section class="card"><span class="tag">' + kindLabel(w) + '</span>' +
          '<div class="big' + (w.en.length > 20 ? ' long' : '') + '">' + esc(w.en) + '</div>' + ipaHtml(w) + speakBtn('Anhören') + '</section>' +
          '<p class="muted center">Weißt du, was das heißt?</p></div>' +
          '<div class="actions"><button class="btn primary" data-a="flip">Umdrehen</button></div>';
      } else {
        body = '<div class="stage"><section class="card"><span class="tag">' + kindLabel(w) + '</span>' +
          '<p class="label">' + esc(w.en) + '</p>' +
          '<div class="big' + (w.de.length > 20 ? ' long' : '') + '">' + esc(w.de) + '</div>' +
          (w.ex ? '<div class="ex"><b>Beispiel</b>' + esc(w.ex) + '</div>' : '') + speakBtn('Anhören') + '</section></div>' +
          '<div class="actions two"><button class="btn warm" data-a="again">Nochmal</button><button class="btn good" data-a="know">Gewusst</button></div>';
      }
    } else if (mode === 'type') {
      var res = s.res;
      var prompt = '<section class="card"><span class="tag">' + kindLabel(w) + '</span><p class="label">Wie heißt das auf Englisch?</p>' +
        '<div class="big' + (w.de.length > 20 ? ' long' : '') + '">' + esc(w.de) + '</div></section>';
      if (s.phase === 'ask') {
        body = '<div class="stage">' + prompt + '<form id="typeForm" class="field" autocomplete="off"><label for="ans" class="sr">Deine Antwort</label>' +
          '<input id="ans" class="input" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="Englisch schreiben"></form></div>' +
          '<div class="actions"><button class="btn primary" data-a="check">Prüfen</button></div>';
      } else {
        var fb;
        if (res.ok) fb = '<div class="fb good" role="status"><strong>' + ICON.check + 'Richtig!</strong><span class="ans">' + esc(w.en) + '</span></div>';
        else fb = '<div class="fb bad" role="status"><strong>' + ICON.cross + (res.near && !s.test ? 'Fast! Schau noch einmal genau hin.' : 'Das war es noch nicht.') + '</strong>' +
          '<span class="muted small">Du hast geschrieben: ' + esc(res.given) + '</span><span class="ans">Richtig ist: ' + esc(w.en) + '</span></div>';
        body = '<div class="stage">' + prompt + fb + ipaHtml(w) + speakBtn('Anhören') + '</div>' +
          '<div class="actions"><button class="btn primary" data-a="next">Weiter</button></div>';
      }
    } else {
      var done = s.phase === 'result';
      var opts = it.opts.map(function (o, i) {
        var cls = '', ic = '';
        if (done) {
          if (o.ok) { cls = ' ok'; ic = '<span style="color:var(--good)">' + ICON.check + '</span>'; }
          else if (s.res.idx === i) { cls = ' no'; ic = '<span style="color:var(--bad)">' + ICON.cross + '</span>'; }
        }
        return '<button class="opt' + cls + '" data-a="pick-opt" data-i="' + i + '"' + (done ? ' disabled' : '') + '><span>' + esc(o.t) + '</span>' + ic + '</button>';
      }).join('');
      body = '<div class="stage"><p class="label center">Was bedeutet das Wort?</p>' +
        '<button class="bigspeak" data-a="speak" aria-label="Wort anhören">' + ICON.speaker(48) + '</button>' +
        (!canSpeak ? '<p class="note">Dieses Gerät kann nicht vorlesen. Das Wort: <b>' + esc(w.en) + '</b></p>' : '') +
        (done ? '<p class="center"><b class="big long" style="font-size:1.6rem">' + esc(w.en) + '</b></p>' + ipaHtml(w).replace('class="ipa"', 'class="ipa center"') : '<p class="muted small center">Kein Ton? Prüfe den Seitenschalter (Stumm) und die Lautstärke.</p>') +
        '<div class="opts" role="group" aria-label="Antworten">' + opts + '</div></div>' +
        '';
    }
    return head + body;
  }

  function vTestResult() {
    var s = session, ratio = s.total ? s.right / s.total : 0;
    var txt = ratio >= 0.9 ? 'Sehr stark!' : ratio >= 0.7 ? 'Gut gemacht!' : ratio >= 0.5 ? 'Schon ordentlich, da geht mehr.' : 'Noch etwas üben, dann klappt es.';
    var wrong = s.wrong.length
      ? '<section class="card"><h3 style="font-size:1.15rem">Das üben wir noch</h3><div class="list">' + s.wrong.map(function (w) {
          return '<div class="li"><div><b>' + esc(w.en) + '</b><div class="de">' + esc(w.de) + '</div></div><span></span></div>';
        }).join('') + '</div></section>'
      : '<p class="center"><b>Kein einziger Fehler!</b></p>';
    return '<div class="stage"><section class="card result"><span class="tag">Mini-Test</span><h2 style="font-size:1.9rem">' + s.right + ' von ' + s.total + ' richtig</h2>' +
      '<p>' + txt + '</p><p class="muted small">Der Test ändert deinen Kasten nicht.</p></section>' + wrong + '</div>' +
      '<div class="actions"><button class="btn primary" data-a="start-test">Neuer Mini-Test</button><button class="btn ghost" data-a="quit">Fertig</button></div>';
  }

  function vResult() {
    if (session && session.test) return vTestResult();
    var s = session, p = profile(), P = prog(), today = P.days[dayKey(new Date())] || 0;
    var ratio = s.total ? s.right / s.total : 0;
    var stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    var txt = stars === 3 ? 'Super gemacht!' : stars === 2 ? 'Gut gemacht!' : 'Dranbleiben, das wird!';
    var sv = '';
    for (var i = 1; i <= 3; i++) sv += '<span class="' + (i <= stars ? 'on' : '') + '">' + ICON.star + '</span>';
    var st = streak();
    var extra = s.practice
      ? '<p class="muted">Übungsrunde: Sie zählt nicht für Fortschritt und Serie.</p>'
      : '<p class="muted">Heute: <b>' + Math.min(today, GOAL) + ' von ' + GOAL + '</b> Wörtern' + (st > 0 ? ' · ' + st + (st === 1 ? ' Tag' : ' Tage') + ' in Folge' : '') + '</p>';
    var petBit = P.pet ? '<div class="pet">' + petArt(110, stars >= 2 ? 'jubel' : 'ruhig') + '</div>' : '';
    return '<div class="stage">' + (levelUpPending() ? levelUpHtml() : '') + '<section class="card result">' + petBit + '<div class="stars" aria-hidden="true">' + sv + '</div>' +
      '<h2 style="font-size:1.9rem">' + txt + '</h2>' +
      '<p><b>' + s.right + ' von ' + s.total + '</b> gleich gewusst, ' + esc(p.name) + '.</p>' + extra + '</section></div>' +
      '<div class="actions"><button class="btn primary" data-a="start" data-m="' + s.mode + '">Noch eine Runde</button>' +
      '<button class="btn ghost" data-a="quit">Fertig</button></div>';
  }

  function vParents() {
    var names = DB.profiles.map(function (p) {
      return '<div class="field"><label for="n-' + esc(p.id) + '">Name</label><input id="n-' + esc(p.id) + '" class="input" data-name="' + esc(p.id) + '" value="' + esc(p.name) + '" maxlength="20"></div>';
    }).join('');
    var chs = chapters();
    var list = chs.map(function (c) {
      var rows = allWords().filter(function (w) { return w.lesson === c.key; }).map(function (w) {
        var custom = w.id.charAt(0) === 'c';
        return '<div class="li"><div><b>' + esc(w.en) + '</b> <span class="tag">' + kindLabel(w) + '</span><div class="de">' + esc(w.de) + '</div></div>' +
          (custom ? '<button class="del" data-a="del" data-id="' + esc(w.id) + '" aria-label="' + esc(w.en) + ' löschen">' + ICON.cross + '</button>' : '<span></span>') + '</div>';
      }).join('');
      return '<details class="chapdet" data-ch="' + esc(c.key) + '"' + (openChap[c.key] ? ' open' : '') + '><summary>' + esc(c.label) + ' <span class="muted small">(' + c.n + ')</span></summary><div class="list">' + rows + '</div></details>';
    }).join('');
    var resets = DB.profiles.map(function (p) {
      if (resetFor === p.id) {
        return '<div class="fb bad"><strong>Fortschritt von ' + esc(p.name) + ' löschen?</strong><span class="ans">Das lässt sich nicht rückgängig machen.</span>' +
          '<div class="actions two" style="margin-top:8px"><button class="btn ghost sm" data-a="reset-no" style="width:100%">Abbrechen</button><button class="btn warm sm" data-a="reset-yes" data-id="' + esc(p.id) + '" style="width:100%">Löschen</button></div></div>';
      }
      return '<button class="btn ghost sm" data-a="reset" data-id="' + esc(p.id) + '" style="width:100%">Fortschritt von ' + esc(p.name) + ' zurücksetzen</button>';
    }).join('');
    var me = DB.profiles.find(function (p) { return p.id === DB.settings.me; });
    var tiere = DB.profiles.map(function (p) {
      var pp = DB.prog[p.id] || {};
      return '<button class="btn ghost sm" data-a="pet-change" data-id="' + esc(p.id) + '" style="width:100%">' + esc(p.name) + ': ' + (pp.pet ? PETS[pp.pet] + ' neu wählen' : 'Tier wird beim nächsten Start gewählt') + '</button>';
    }).join('');
    return '<div class="shead"><button class="icon-btn" data-a="quit" aria-label="Zurück">' + ICON.back + '</button><h1 style="font-size:1.7rem">Für Eltern</h1></div>' +
      '<p class="note">' + esc(cloudLine()) + '</p>' +
      '<section class="sec"><h2>Profil auf diesem Gerät</h2><p class="muted small">Dieses Gerät gehört: <b>' + (me ? esc(me.name) : 'noch niemandem') + '</b></p>' +
      '<button class="btn ghost sm" data-a="me-change" style="width:100%">Profil auf diesem Gerät ändern</button></section>' +
      '<section class="sec"><h2>Namen</h2>' + names + '</section>' +
      '<section class="sec"><h2>Töne</h2><label class="switch"><input type="checkbox" id="sndToggle"' + (soundOn() ? ' checked' : '') + '><span>Töne bei Antworten und Belohnungen</span></label><p class="muted small">Auf dem iPhone stumm, wenn der Seitenschalter auf Stumm steht.</p></section>' +
      '<section class="sec"><h2>Anzeige</h2><label class="switch"><input type="checkbox" id="ipaToggle"' + (DB.settings.ipa ? ' checked' : '') + '><span>Lautschrift anzeigen</span></label></section>' +
      '<section class="sec"><h2>Tiere</h2>' + tiere + '</section>' +
      '<section class="sec"><h2>Fortschritt</h2>' + resets + '</section>' +
      '<section class="sec"><h2>Neues Wort</h2><form id="addForm" class="sec" autocomplete="off">' +
      '<div class="field"><label for="addEn">Englisch</label><input id="addEn" class="input" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
      '<div class="field"><label for="addDe">Deutsch (mehrere Bedeutungen mit Strichpunkt trennen)</label><input id="addDe" class="input" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
      '<div class="field"><label for="addEx">Beispielsatz (optional)</label><input id="addEx" class="input" autocorrect="off" spellcheck="false"></div>' +
      '<button class="btn primary" type="submit">Hinzufügen</button>' + (msg ? '<p class="ok-msg" role="status">' + esc(msg) + '</p>' : '') + '</form></section>' +
      '<section class="sec"><h2>Wörter (' + allWords().length + ')</h2>' + list + '</section>';
  }

  /* ---------- Rendern ---------- */
  function render() {
    var app = $('#app'), h;
    if (view === 'profiles') h = vProfiles();
    else if (view === 'pet') h = vPet();
    else if (view === 'home') h = vHome();
    else if (view === 'session') h = vSession();
    else if (view === 'result') h = vResult();
    else h = vParents();
    app.innerHTML = h;
    try { window.scrollTo(0, 0); } catch (e) {}
    if ((view === 'result' || view === 'home') && levelUpPending() && lvlSoundFor !== petStage()) { lvlSoundFor = petStage(); sfx('level'); }
    else if (view === 'result' && session && !session.sfxDone) {
      session.sfxDone = true;
      var rt = session.total ? session.right / session.total : 0;
      sfx(rt >= 0.9 ? 'r3' : rt >= 0.7 ? 'r2' : 'r1');
    }
    if (view === 'session') {
      var s = session;
      if (curMode(s) === 'type' && s.phase === 'ask') { var inp = $('#ans'); if (inp) inp.focus(); }
      if (curMode(s) === 'listen' && s.phase === 'ask' && s.auto) { s.auto = false; speak(spoken(s.q[s.i].w)); }
    }
  }

  /* ---------- Ablauf ---------- */
  function startSession(mode) {
    var q = buildQueue(false), practice = false;
    if (!q.length) { q = buildQueue(true); practice = true; }
    session = {
      mode: mode, practice: practice, i: 0, right: 0, total: 0,
      q: q.map(function (w) { return { w: w, retry: false, opts: mode === 'listen' ? makeOpts(w) : null }; }),
      phase: mode === 'cards' ? 'front' : 'ask', res: null, auto: true
    };
    view = 'session'; render();
  }

  function startTest() {
    var pool = shuffle(selectedWords().slice()).slice(0, TEST_SIZE);
    if (!pool.length) return;
    var subs = shuffle(pool.map(function (_, i) { return i % 2 ? 'type' : 'listen'; }));
    session = {
      mode: 'test', test: true, practice: false, i: 0, right: 0, total: 0, wrong: [],
      q: pool.map(function (w, i) { return { w: w, retry: false, sub: subs[i], opts: subs[i] === 'listen' ? makeOpts(w) : null }; }),
      phase: 'ask', res: null, auto: true
    };
    // Typ-Fragen starten in 'ask'; Hör-Fragen ebenfalls
    view = 'session'; render();
  }

  function record(ok) {
    var s = session, it = s.q[s.i];
    if (it.retry) return;
    s.total++; if (ok) s.right++;
    sfx(ok ? 'ok' : 'bad');
    if (s.test) { if (!ok) s.wrong.push(it.w); return; }
    if (!s.practice) {
      var P = prog(), c = P.cards[it.w.id] || { box: 1, due: 0, right: 0, wrong: 0 };
      if (ok) { c.box = Math.min(5, c.box + 1); c.right++; } else { c.box = 1; c.wrong++; }
      c.due = dueTs(INTERVALS[c.box]);
      P.cards[it.w.id] = c;
      var k = dayKey(new Date()); P.days[k] = (P.days[k] || 0) + 1;
      save(['prog-' + pid]);
    }
    if (!ok) s.q.push({ w: it.w, retry: true, opts: s.mode === 'listen' ? makeOpts(it.w) : null });
  }

  function nextItem() {
    var s = session; clearTimeout(s.timer); s.i++;
    if (s.i >= s.q.length) { view = 'result'; render(); return; }
    s.phase = curMode(s) === 'cards' ? 'front' : 'ask'; s.res = null; s.auto = true; render();
  }

  function keepScroll() { var y = 0; try { y = window.scrollY; } catch (e) {} render(); try { window.scrollTo(0, y); } catch (e) {} }
  var act = {
    pick: function (d) { pid = d.id; DB.settings.me = d.id; save(['config']); if (!prog().pet) { petSel = null; view = 'pet'; } else view = 'home'; render(); },
    'pet-back': function () { DB.settings.me = null; save(['config']); pid = null; petSel = null; view = 'profiles'; render(); },
    'me-change': function () { DB.settings.me = null; save(['config']); pid = null; view = 'profiles'; render(); },
    'pet-sel': function (d) { petSel = d.k; keepScroll(); },
    'pet-ok': function () { if (!petSel) return; var P = prog(); P.pet = petSel; P.seen = petStage(); save(['prog-' + pid]); view = 'home'; render(); },
    'lvl-ok': function () { var P = prog(); P.seen = petStage(); save(['prog-' + pid]); render(); },
    snd: function () { DB.settings.sound = !soundOn(); save(['config']); if (soundOn()) sfx('ok'); keepScroll(); },
    'pet-change': function (d) { var P = DB.prog[d.id]; if (P) { delete P.pet; P.seen = 0; save(['prog-' + d.id]); } msg = ''; render(); },
    'home-out': function () { view = 'profiles'; render(); },
    parents: function () {
      var a = 13 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 4);
      var r = window.prompt('Nur für Eltern. Bitte rechnen: ' + a + ' × ' + b + ' = ?');
      if (r === null || parseInt(r, 10) !== a * b) return;
      msg = ''; resetFor = null; view = 'parents'; render();
    },
    quit: function () { if (session) clearTimeout(session.timer); if (view === 'parents') { view = (pid && prog()) ? 'home' : 'profiles'; } else { view = 'home'; } render(); },
    'start-test': function () { startTest(); },
    start: function (d) { if (selectedWords().length) startSession(d.m); },
    'chap-all': function () {
      var chs = chapters(), allOn = chs.every(function (c) { return chapOn(c.key); });
      DB.settings.off = allOn ? chs.map(function (c) { return c.key; }) : [];
      save(['config']); keepScroll();
    },
    speak: function () { var s = session; if (s) speak(spoken(s.q[s.i].w)); },
    flip: function () { session.phase = 'back'; render(); },
    know: function () { record(true); nextItem(); },
    again: function () { record(false); nextItem(); },
    check: function () {
      var inp = $('#ans'); if (!inp || !inp.value.trim()) { if (inp) inp.focus(); return; }
      var s = session, res = checkTyped(s.q[s.i].w, inp.value.trim());
      s.res = res; s.phase = 'result'; record(res.ok); render();
    },
    'pick-opt': function (d) {
      var s = session, i = +d.i, it = s.q[s.i];
      var ok = !!it.opts[i].ok, at = s.i;
      s.res = { idx: i }; s.phase = 'result'; record(ok); render();
      clearTimeout(s.timer);
      s.timer = setTimeout(function () {
        if (view === 'session' && session === s && s.phase === 'result' && s.i === at) nextItem();
      }, ok ? 1100 : 2400);
    },
    next: function () { nextItem(); },
    addWord: function () {
      var en = $('#addEn').value.trim(), de = $('#addDe').value.trim(), ex = $('#addEx').value.trim();
      if (!en || !de) { msg = ''; $(en ? '#addDe' : '#addEn').focus(); return; }
      var deA = de.split(';').map(function (x) { return x.trim(); }).filter(Boolean);
      var enA = /^to\s+\S+/i.test(en) ? [en.replace(/^to\s+/i, '')] : [];
      DB.custom.push({
        id: 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1000), en: en, ipa: '', de: deA.join('; '), deA: deA,
        ex: ex, kind: /\s/.test(en.replace(/^to\s+/i, '')) ? 'p' : 'w', enA: enA, lesson: 'Eigene Wörter'
      });
      save(['config']); msg = '„' + en + '“ ist dabei.'; render();
    },
    del: function (d) { DB.custom = DB.custom.filter(function (w) { return w.id !== d.id; }); save(['config']); render(); },
    reset: function (d) { resetFor = d.id; render(); },
    'reset-no': function () { resetFor = null; render(); },
    'reset-yes': function (d) { var old = DB.prog[d.id] || {}; DB.prog[d.id] = { cards: {}, days: {}, pet: old.pet, seen: 0 }; save(['prog-' + d.id]); resetFor = null; render(); }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
    var f = act[t.dataset.a]; if (f) f(t.dataset);
  });
  document.addEventListener('toggle', function (e) { var t = e.target; if (t && t.dataset && t.dataset.ch !== undefined) openChap[t.dataset.ch] = t.open; }, true);
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'typeForm') act.check();
    if (e.target.id === 'addForm') act.addWord();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.name) {
      var pr = DB.profiles.find(function (x) { return x.id === t.dataset.name; }), v = t.value.trim();
      if (pr && v) { pr.name = v.slice(0, 20); save(['config']); }
    }
    if (t.dataset && t.dataset.chap !== undefined) {
      var ch = chapters()[+t.dataset.chap];
      if (ch) {
        var off = (DB.settings.off || []).filter(function (k) { return k !== ch.key; });
        if (!t.checked) off.push(ch.key);
        DB.settings.off = off; save(['config']); keepScroll();
      }
    }
    if (t.id === 'sndToggle') { DB.settings.sound = t.checked; save(['config']); if (t.checked) sfx('ok'); }
    if (t.id === 'ipaToggle') { DB.settings.ipa = t.checked; save(['config']); }
  });
  if (canSpeak) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

  /* Gerät merkt sich sein Kind: kein Profil-Auswahlbildschirm mehr im Alltag */
  (function () {
    var me = DB.settings.me;
    if (!DB.profiles.some(function (p) { return p.id === me; })) {
      me = null;
      var used = DB.profiles.filter(function (p) {
        var P = DB.prog[p.id] || {};
        return Object.keys(P.cards || {}).length || Object.keys(P.days || {}).length || P.pet;
      });
      if (used.length === 1) { me = used[0].id; DB.settings.me = me; save(['config']); }
    }
    if (me) { pid = me; view = prog().pet ? 'home' : 'pet'; }
  })();

  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  initCloud();
})();
</script>
</body>
</html>
